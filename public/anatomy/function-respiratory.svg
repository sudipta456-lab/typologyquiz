<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Breathing pressure and ongoing gas-exchange schematic</title>
  <desc id="desc">Four original panels show inhale, pause-in, exhale, and pause-out. Each panel also shows oxygen moving toward blood and carbon dioxide toward alveolar air.</desc>
  <rect width="1200" height="900" rx="34" fill="#f5f8fb"/>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="750" fill="#18324b">Two processes, one cycle</text>
  <text x="600" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#52687b">Bulk airflow follows pressure · gas exchange continues across the boundary</text>
  <g stroke="#b9c8d5" stroke-width="5" fill="none" stroke-linecap="round"><path d="M190 170 L260 205"/><path d="M1010 170 L940 205"/><path d="M190 730 L260 690"/><path d="M1010 730 L940 690"/></g>
  <g font-family="system-ui,sans-serif">
    <g><rect x="260" y="165" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="280" y="185" width="100" height="32" rx="16" fill="#d9edf8"/><text x="330" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#245c80">INHALE</text><text x="282" y="250" font-size="21" font-weight="700" fill="#18324b">Volume expands</text><text x="282" y="278" font-size="16" fill="#52687b">Alveolar pressure briefly lower</text><path d="M390 303 V339" stroke="#2876a8" stroke-width="6"/><path d="M378 326 L390 342 L402 326" fill="none" stroke="#2876a8" stroke-width="5"/><path d="M358 355 C336 336 318 359 333 381 Q358 408 383 381 C398 359 380 336 358 355Z" fill="#d9edf8" stroke="#2876a8" stroke-width="3"/><path d="M430 365 H468" stroke="#2e8b57" stroke-width="4"/><path d="M460 357 L472 365 L460 373" fill="none" stroke="#2e8b57" stroke-width="4"/><path d="M470 389 H432" stroke="#7556a3" stroke-width="4"/><path d="M440 381 L428 389 L440 397" fill="none" stroke="#7556a3" stroke-width="4"/><text x="415" y="410" text-anchor="middle" font-size="13" fill="#52687b">O₂ to blood · CO₂ to air</text></g>
    <g><rect x="630" y="165" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="650" y="185" width="130" height="32" rx="16" fill="#e5e2f4"/><text x="715" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#4e448a">PAUSE-IN</text><text x="652" y="250" font-size="21" font-weight="700" fill="#18324b">Bulk flow pauses</text><text x="652" y="278" font-size="16" fill="#52687b">Alveolar ≈ ambient pressure</text><path d="M760 303 V340" stroke="#6256a5" stroke-width="5"/><path d="M747 316 L760 303 L773 316 M747 327 L760 340 L773 327" fill="none" stroke="#6256a5" stroke-width="4"/><path d="M718 355 C696 336 678 359 693 381 Q718 408 743 381 C758 359 740 336 718 355Z" fill="#e5e2f4" stroke="#6256a5" stroke-width="3"/><path d="M790 365 H828" stroke="#2e8b57" stroke-width="4"/><path d="M820 357 L832 365 L820 373" fill="none" stroke="#2e8b57" stroke-width="4"/><path d="M830 389 H792" stroke="#7556a3" stroke-width="4"/><path d="M800 381 L788 389 L800 397" fill="none" stroke="#7556a3" stroke-width="4"/><text x="785" y="410" text-anchor="middle" font-size="13" fill="#52687b">Exchange continues</text></g>
    <g><rect x="260" y="480" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="280" y="500" width="100" height="32" rx="16" fill="#f5e5dc"/><text x="330" y="523" text-anchor="middle" font-size="15" font-weight="700" fill="#8e4b32">EXHALE</text><text x="282" y="565" font-size="21" font-weight="700" fill="#18324b">Volume decreases</text><text x="282" y="593" font-size="16" fill="#52687b">Alveolar pressure briefly higher</text><path d="M390 662 V626" stroke="#ba6543" stroke-width="6"/><path d="M378 635 L390 619 L402 635" fill="none" stroke="#ba6543" stroke-width="5"/><path d="M358 675 C336 656 318 679 333 701 Q358 728 383 701 C398 679 380 656 358 675Z" fill="#f5e5dc" stroke="#ba6543" stroke-width="3"/><path d="M430 685 H468" stroke="#2e8b57" stroke-width="4"/><path d="M460 677 L472 685 L460 693" fill="none" stroke="#2e8b57" stroke-width="4"/><path d="M470 709 H432" stroke="#7556a3" stroke-width="4"/><path d="M440 701 L428 709 L440 717" fill="none" stroke="#7556a3" stroke-width="4"/><text x="415" y="730" text-anchor="middle" font-size="13" fill="#52687b">Exchange continues</text></g>
    <g><rect x="630" y="480" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="650" y="500" width="140" height="32" rx="16" fill="#e5e2f4"/><text x="720" y="523" text-anchor="middle" font-size="15" font-weight="700" fill="#4e448a">PAUSE-OUT</text><text x="652" y="565" font-size="21" font-weight="700" fill="#18324b">Bulk flow pauses</text><text x="652" y="593" font-size="16" fill="#52687b">Alveolar ≈ ambient pressure</text><path d="M760 620 V657" stroke="#6256a5" stroke-width="5"/><path d="M747 633 L760 620 L773 633 M747 644 L760 657 L773 644" fill="none" stroke="#6256a5" stroke-width="4"/><path d="M718 675 C696 656 678 679 693 701 Q718 728 743 701 C758 679 740 656 718 675Z" fill="#e5e2f4" stroke="#6256a5" stroke-width="3"/><path d="M790 685 H828" stroke="#2e8b57" stroke-width="4"/><path d="M820 677 L832 685 L820 693" fill="none" stroke="#2e8b57" stroke-width="4"/><path d="M830 709 H792" stroke="#7556a3" stroke-width="4"/><path d="M800 701 L788 709 L800 717" fill="none" stroke="#7556a3" stroke-width="4"/><text x="785" y="730" text-anchor="middle" font-size="13" fill="#52687b">Exchange continues</text></g>
  </g>
  <g font-family="system-ui,sans-serif" font-size="58" font-weight="750" text-anchor="middle" fill="#18324b"><circle cx="110" cy="120" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="110" y="140">A</text><circle cx="1090" cy="120" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="1090" y="140">B</text><circle cx="110" cy="780" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="110" y="800">C</text><circle cx="1090" cy="780" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="1090" y="800">D</text></g>
  <text x="600" y="830" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#52687b">Conceptual quiet-breathing cycle · no action for the learner to perform</text>
</svg>
