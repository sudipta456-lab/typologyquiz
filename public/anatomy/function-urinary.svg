<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Nephron tracer process teaching schematic</title>
  <desc id="desc">An original enlarged, not-to-scale model shows filtration, reabsorption to blood, secretion into the tubule, and collection of remaining fluid.</desc>
  <rect width="1200" height="900" rx="34" fill="#f7f8f6"/>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="750" fill="#18324b">Follow a tracer through a nephron model</text>
  <text x="600" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#52687b">Original schematic · enlarged · not to scale · processes can overlap in a real nephron</text>
  <g stroke="#bac7c4" stroke-width="5" fill="none" stroke-linecap="round"><path d="M190 170 L260 205"/><path d="M1010 170 L940 205"/><path d="M190 730 L260 690"/><path d="M1010 730 L940 690"/></g>
  <g font-family="system-ui,sans-serif">
    <g><rect x="260" y="165" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="280" y="185" width="106" height="32" rx="16" fill="#f3dfdf"/><text x="333" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#853c3c">FILTER</text><text x="282" y="250" font-size="21" font-weight="700" fill="#18324b">Blood → tubule</text><text x="282" y="278" font-size="15" fill="#52687b">Water + small solutes cross</text><circle cx="370" cy="341" r="42" fill="#faeeee" stroke="#a84545" stroke-width="6"/><path d="M339 341 C350 307 387 307 400 341 C387 375 350 375 339 341Z" fill="none" stroke="#a84545" stroke-width="5"/><path d="M417 342 H470" stroke="#c28b35" stroke-width="6"/><path d="M459 332 L475 342 L459 352" fill="none" stroke="#c28b35" stroke-width="5"/><text x="415" y="404" text-anchor="middle" font-size="13" fill="#52687b">Cells / large proteins retained</text></g>
    <g><rect x="630" y="165" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="650" y="185" width="130" height="32" rx="16" fill="#d9f1ed"/><text x="715" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#12675f">RECOVER</text><text x="652" y="250" font-size="21" font-weight="700" fill="#18324b">Tubule → blood</text><text x="652" y="278" font-size="15" fill="#52687b">Selected water / solutes return</text><path d="M700 330 C700 300 737 300 737 330 V352 C737 381 775 381 775 352 V330 C775 300 812 300 812 330 V352 C812 381 850 381 850 352" fill="none" stroke="#c28b35" stroke-width="12" stroke-linecap="round"/><path d="M766 357 V309" stroke="#218a78" stroke-width="6"/><path d="M756 319 L766 303 L776 319" fill="none" stroke="#218a78" stroke-width="5"/><text x="785" y="404" text-anchor="middle" font-size="13" fill="#52687b">Reabsorption returns material</text></g>
    <g><rect x="260" y="480" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="280" y="500" width="112" height="32" rx="16" fill="#e8e4f4"/><text x="336" y="523" text-anchor="middle" font-size="15" font-weight="700" fill="#4e448a">ADD / SECRETE</text><text x="282" y="565" font-size="21" font-weight="700" fill="#18324b">Blood → tubule</text><text x="282" y="593" font-size="15" fill="#52687b">Selected substances enter fluid</text><path d="M310 663 H380" stroke="#a84545" stroke-width="12" stroke-linecap="round"/><path d="M380 663 C420 663 420 620 460 620 H478" fill="none" stroke="#c28b35" stroke-width="12" stroke-linecap="round"/><path d="M394 649 L410 663 L394 677" fill="none" stroke="#6657a8" stroke-width="6"/><text x="415" y="716" text-anchor="middle" font-size="13" fill="#52687b">A different direction than recovery</text></g>
    <g><rect x="630" y="480" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="650" y="500" width="122" height="32" rx="16" fill="#f7ead5"/><text x="711" y="523" text-anchor="middle" font-size="15" font-weight="700" fill="#87520b">COLLECT</text><text x="652" y="565" font-size="21" font-weight="700" fill="#18324b">Fluid continues</text><text x="652" y="593" font-size="15" fill="#52687b">Tubule → collecting duct → urine</text><path d="M690 646 C690 616 728 616 728 646 V668 C728 697 766 697 766 668 V646 C766 616 804 616 804 646 V668 Q804 700 836 700" fill="none" stroke="#c28b35" stroke-width="12" stroke-linecap="round"/><path d="M836 700 H892" stroke="#c28b35" stroke-width="10" stroke-linecap="round"/><path d="M878 690 L894 700 L878 710" fill="none" stroke="#c28b35" stroke-width="5"/><text x="785" y="716" text-anchor="middle" font-size="13" fill="#52687b">Not all initial filtrate remains</text></g>
  </g>
  <g font-family="system-ui,sans-serif" font-size="58" font-weight="750" text-anchor="middle" fill="#18324b"><circle cx="110" cy="120" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="110" y="140">A</text><circle cx="1090" cy="120" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="1090" y="140">B</text><circle cx="110" cy="780" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="110" y="800">C</text><circle cx="1090" cy="780" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="1090" y="800">D</text></g>
  <text x="600" y="830" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#52687b">Blood is red in the diagram; distinct colors mark process direction, not different blood types.</text>
</svg>
