<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Neuron threshold and chemical synapse teaching schematic</title>
  <desc id="desc">An original four-panel multipolar-neuron model shows graded inputs, action-potential propagation, calcium-triggered transmitter release, and a receptor-dependent postsynaptic response.</desc>
  <rect width="1200" height="900" rx="34" fill="#f5f8fb"/>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="750" fill="#18324b">From local input to cell-to-cell handoff</text>
  <text x="600" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#52687b">Simplified multipolar neuron · chemical synapse · not a brain-region map</text>
  <g stroke="#b9c8d5" stroke-width="5" fill="none" stroke-linecap="round"><path d="M190 170 L260 205"/><path d="M1010 170 L940 205"/><path d="M190 730 L260 690"/><path d="M1010 730 L940 690"/></g>
  <g font-family="system-ui,sans-serif">
    <g><rect x="260" y="165" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="280" y="185" width="104" height="32" rx="16" fill="#deeee6"/><text x="332" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#32664e">RECEIVE</text><text x="282" y="250" font-size="21" font-weight="700" fill="#18324b">Inputs sum locally</text><text x="282" y="278" font-size="15" fill="#52687b">Net input approaches threshold</text><circle cx="365" cy="344" r="27" fill="#deeee6" stroke="#4d8c72" stroke-width="4"/><path d="M341 337 L311 315 M341 349 L310 367 M389 344 H447" stroke="#4d8c72" stroke-width="7" stroke-linecap="round"/><path d="M329 325 L310 315 L319 335 M322 357 L310 367 L330 365" fill="none" stroke="#4d8c72" stroke-width="4"/><path d="M420 326 V360" stroke="#c28b35" stroke-width="4" stroke-dasharray="5 5"/><text x="415" y="404" text-anchor="middle" font-size="13" fill="#52687b">Action potential only at threshold</text></g>
    <g><rect x="630" y="165" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="650" y="185" width="130" height="32" rx="16" fill="#d9edf8"/><text x="715" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#245c80">PROPAGATE</text><text x="652" y="250" font-size="21" font-weight="700" fill="#18324b">A voltage wave travels</text><text x="652" y="278" font-size="15" fill="#52687b">Local membrane changes along axon</text><path d="M690 343 H850" stroke="#2876a8" stroke-width="14" stroke-linecap="round"/><path d="M726 343 L746 311 L766 343 L786 375 L806 343" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><path d="M825 329 L847 343 L825 357" fill="none" stroke="#2876a8" stroke-width="6"/><text x="785" y="404" text-anchor="middle" font-size="13" fill="#52687b">Not one ion moving the full length</text></g>
    <g><rect x="260" y="480" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="280" y="500" width="136" height="32" rx="16" fill="#f0e2f0"/><text x="348" y="523" text-anchor="middle" font-size="15" font-weight="700" fill="#744776">RELEASE</text><text x="282" y="565" font-size="21" font-weight="700" fill="#18324b">Electrical → chemical</text><text x="282" y="593" font-size="15" fill="#52687b">Terminal calcium entry aids release</text><path d="M305 662 H370" stroke="#2876a8" stroke-width="12" stroke-linecap="round"/><circle cx="382" cy="662" r="23" fill="#f0e2f0" stroke="#9a5a9b" stroke-width="4"/><circle cx="374" cy="655" r="4" fill="#9a5a9b"/><circle cx="390" cy="668" r="4" fill="#9a5a9b"/><circle cx="426" cy="651" r="6" fill="#9a5a9b"/><circle cx="448" cy="662" r="6" fill="#9a5a9b"/><circle cx="426" cy="674" r="6" fill="#9a5a9b"/><path d="M411 628 V696" stroke="#b9c8d5" stroke-width="4" stroke-dasharray="5 6"/><text x="415" y="716" text-anchor="middle" font-size="13" fill="#52687b">Messengers cross the cleft</text></g>
    <g><rect x="630" y="480" width="310" height="255" rx="24" fill="#fff" stroke="#d8e2ea" stroke-width="2"/><rect x="650" y="500" width="128" height="32" rx="16" fill="#f7ead5"/><text x="714" y="523" text-anchor="middle" font-size="15" font-weight="700" fill="#87520b">RESPOND</text><text x="652" y="565" font-size="21" font-weight="700" fill="#18324b">Receptor shapes effect</text><text x="652" y="593" font-size="15" fill="#52687b">A local change is not a guarantee</text><path d="M690 652 H850" stroke="#c28b35" stroke-width="12" stroke-linecap="round"/><path d="M750 628 V676 M770 628 V676" stroke="#9a5a9b" stroke-width="7"/><circle cx="760" cy="614" r="7" fill="#9a5a9b"/><path d="M818 633 V667" stroke="#c28b35" stroke-width="4" stroke-dasharray="5 5"/><text x="785" y="716" text-anchor="middle" font-size="13" fill="#52687b">New action potential needs threshold</text></g>
  </g>
  <g font-family="system-ui,sans-serif" font-size="58" font-weight="750" text-anchor="middle" fill="#18324b"><circle cx="110" cy="120" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="110" y="140">A</text><circle cx="1090" cy="120" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="1090" y="140">B</text><circle cx="110" cy="780" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="110" y="800">C</text><circle cx="1090" cy="780" r="90" fill="#fff" stroke="#9bb0bf" stroke-width="5"/><text x="1090" y="800">D</text></g>
  <text x="600" y="830" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#52687b">Electrical and chemical stages are distinguished by mechanism, not by brain location.</text>
</svg>
