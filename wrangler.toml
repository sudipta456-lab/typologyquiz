# Cloudflare Workers hosting for Next.js `output: "export"`
# Build: npm run build  →  deploys the `out/` folder
#
# `main` handles /api/stats/* (live play counts) and hands every other request
# to the static assets, so the site is unchanged if the worker is removed.

name = "typologyquiz"
main = "worker/index.js"
compatibility_date = "2025-07-01"

# Custom domains (zone must already be in this Cloudflare account)
# Deploy attaches DNS + certs automatically for these hostnames
[[routes]]
pattern = "typologyquiz.com"
custom_domain = true

[[routes]]
pattern = "www.typologyquiz.com"
custom_domain = true

[assets]
directory = "./out"
binding = "ASSETS"
# Match Next.js trailingSlash: true
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
# By DEFAULT, a request matching a static asset is served directly and the
# Worker's fetch handler never runs at all - which is what made the R2
# handbook code below dead code the first time this was tried, and every
# check of it was silently passing against the bundled copy instead of R2.
#
# The fix is NOT a scoped path list. Scoping run_worker_first to just
# "/handbook/*" was tried first and broke every POST endpoint on the site -
# /api/stats and /api/short both started returning a platform-level 405 with
# an empty body (not this worker's own JSON error shape) the moment the array
# was set, because Cloudflare's asset router treats an explicit
# run_worker_first list as an instruction to fall back to STRICT asset
# semantics for every path NOT on the list: GET/HEAD only, everything else
# auto-rejected before the Worker ever runs. Confirmed live: a POST to
# /api/stats/mental-age, unchanged in months, started 405ing the moment this
# was scoped.
#
# `true` restores worker-first for every request, matching what the site
# always relied on, and the worker's own routing (this file's fetch handler)
# decides per-path whether to serve from R2, KV, or fall through to
# env.ASSETS.fetch(request) - which it already does at the bottom for
# everything not otherwise claimed.
run_worker_first = true

# Per-quiz score histograms for "you beat X% of players".
[[kv_namespaces]]
binding = "TRIVIA_STATS"
id = "74c83b9ecf6748ba8a87c7b322016125"

# Short share links: code -> the site path it stands for. Only ever written
# when a visitor asks for a short link, and only ever holds paths on this site.
[[kv_namespaces]]
binding = "SHORT_LINKS"
id = "06aff94ce51f4aa39c8d2f868f631dbd"

# Handbook snippet images. They live here rather than in [assets] because the
# free Workers plan allows 20,000 static asset files per version and the build
# reached 20,324; each new jurisdiction adds roughly 180 more. The worker falls
# back to the static assets when a key is missing, so this is safe to enable
# before the bucket is filled.
#
# Create with:  npx wrangler r2 bucket create typologyquiz-handbook
# Fill with:    node scripts/upload-handbook-r2.mjs
[[r2_buckets]]
binding = "HANDBOOK"
bucket_name = "typologyquiz-handbook"
